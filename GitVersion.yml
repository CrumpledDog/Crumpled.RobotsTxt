mode: ContinuousDelivery
branches:
  main:
    mode: ContinuousDelivery
    tag: ''
    increment: Inherit
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    regex: ^master$|^main$|^main-bellissima$
    source-branches:
    - develop
    - hotfix
    - feature
    tracks-release-branches: false
    is-release-branch: true
    is-mainline: true
    pre-release-weight: 55000
  develop:
    mode: ContinuousDeployment
    tag: alpha
    increment: Inherit
    prevent-increment-of-merged-branch-version: false
    track-merge-target: true
    regex: ^dev(elop)?(ment)?$
    source-branches: []
    tracks-release-branches: true
    is-release-branch: true
    is-mainline: false
    pre-release-weight: 0
  feature:
    mode: ContinuousDelivery
    tag: useBranchName
    increment: Minor
    prevent-increment-of-merged-branch-version: false
    track-merge-target: false
    regex: ^feature?[/-]
    source-branches:
    - develop
    - main
    tracks-release-branches: false
    is-release-branch: false
    is-mainline: false
    pre-release-weight: 30000
  hotfix:
    mode: ContinuousDelivery
    tag: beta
    increment: Patch
    prevent-increment-of-merged-branch-version: false
    track-merge-target: false
    regex: ^hotfix(es)?[/-]
    source-branches:
    - develop
    - main
    - support
    tracks-release-branches: false
    is-release-branch: false
    is-mainline: false
    pre-release-weight: 30000
ignore:
  sha: []
merge-message-formats: {}
