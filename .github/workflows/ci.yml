name: Verify Build

env:
  PATH_TO_EXTENSION: "src/Crumpled.RobotsTxt"
  DOTNET_VERSION: '10'

on:
  push:
    branches: [ "develop/v3" ]

  workflow_dispatch:

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.set-version.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
        
      - name: Fetch all tags
        run: git fetch --force --tags
          
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits

      - name: Set Version
        id: set-version
        run: |
          if [ -n "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "version=${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          else
            # Get the latest tag from git
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              # Remove 'v' prefix if present
              LATEST_VERSION=${LATEST_TAG#v}
              echo "version=${LATEST_VERSION}-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
            else
              echo "version=0.1.0-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Echo the version
        run: |
          echo "Version to use: '${{ steps.set-version.outputs.version }}'"
          echo "New release version: '${{ steps.semantic.outputs.new_release_version }}'"
          echo "New release major: '${{ steps.semantic.outputs.new_release_major_version }}'"
          echo "New release minor: '${{ steps.semantic.outputs.new_release_minor_version }}'"
          echo "New release patch: '${{ steps.semantic.outputs.new_release_patch_version }}'"
          echo "Last release version: '${{ steps.semantic.outputs.last_release_version }}'"
          echo "New release published: '${{ steps.semantic.outputs.new_release_published }}'"
  build:
    name: Build, Run, CodeGen and Package
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet
      id: nuget-packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-nuget-

    - name: Update Version Files
      run: |

        jq '.version = "${{ needs.setup.outputs.semver }}"' ${{ env.PATH_TO_EXTENSION }}/wwwroot/umbraco-package.json > temp.json && mv temp.json ${{ env.PATH_TO_EXTENSION }}/wwwroot/umbraco-package.json
        echo "Updated version in ${{ env.PATH_TO_EXTENSION }}/wwwroot/umbraco-package.json to ${{ needs.setup.outputs.semver }}"

        # Convert semantic version to numeric file version (e.g., 2.0.0-alpha.1 -> 2.0.0.1)
        SEMVER="${{ needs.setup.outputs.semver }}"
        if [[ $SEMVER == *"-"* ]]; then
          BASE_VERSION=$(echo $SEMVER | cut -d'-' -f1)
          PRERELEASE=$(echo $SEMVER | cut -d'-' -f2)
          # Extract number from prerelease (e.g., alpha.1 -> 1, beta.2 -> 2)
          PRERELEASE_NUM=$(echo $PRERELEASE | grep -o '[0-9]\+$' || echo "0")
          FILE_VERSION="${BASE_VERSION}.${PRERELEASE_NUM}"
        else
          FILE_VERSION="${SEMVER}.0"
        fi
        
        # Update both main and core project files
        update_file_version() {
          local CSPROJ_PATH=$1
          local FILE_VERSION=$2
          local INFORMATIONAL_VERSION=$3
          
          if [ ! -f "$CSPROJ_PATH" ]; then
            echo "Warning: $CSPROJ_PATH not found"
            return
          fi
          
          # Check if FileVersion element exists
          if grep -q "<FileVersion>" "$CSPROJ_PATH"; then
            # Update existing FileVersion
            sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>$FILE_VERSION</FileVersion>|" "$CSPROJ_PATH"
            echo "Updated FileVersion in $CSPROJ_PATH to $FILE_VERSION"
          else
            # Add FileVersion to the first PropertyGroup
            sed -i "0,/<PropertyGroup>/s|<PropertyGroup>|<PropertyGroup>\n\t\t<FileVersion>$FILE_VERSION</FileVersion>|" "$CSPROJ_PATH"
            echo "Added FileVersion to $CSPROJ_PATH with value $FILE_VERSION"
          fi
          
          # Check if InformationalVersion element exists
          if grep -q "<InformationalVersion>" "$CSPROJ_PATH"; then
            # Update existing InformationalVersion
            sed -i "s|<InformationalVersion>.*</InformationalVersion>|<InformationalVersion>$INFORMATIONAL_VERSION</InformationalVersion>|" "$CSPROJ_PATH"
            echo "Updated InformationalVersion in $CSPROJ_PATH to $INFORMATIONAL_VERSION"
          else
            # Add InformationalVersion to the first PropertyGroup
            sed -i "0,/<PropertyGroup>/s|<PropertyGroup>|<PropertyGroup>\n\t\t<InformationalVersion>$INFORMATIONAL_VERSION</InformationalVersion>|" "$CSPROJ_PATH"
            echo "Added InformationalVersion to $CSPROJ_PATH with value $INFORMATIONAL_VERSION"
          fi
        }
        
        # Update both project files
        update_file_version "src/Crumpled.RobotsTxt/Crumpled.RobotsTxt.csproj" "$FILE_VERSION" "$SEMVER"
        update_file_version "src/Crumpled.RobotsTxt.Core/Crumpled.RobotsTxt.Core.csproj" "$FILE_VERSION" "$SEMVER"

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release

    - name: Run Integration Tests
      run: |
        dotnet test tests/Crumpled.RobotsTxt.Tests.Integration/Crumpled.RobotsTxt.Tests.Integration.csproj --configuration Release --framework net8.0 --logger "trx;LogFileName=test-results-net8.0.trx" --logger "console;verbosity=normal"
        dotnet test tests/Crumpled.RobotsTxt.Tests.Integration/Crumpled.RobotsTxt.Tests.Integration.csproj --configuration Release --framework net10.0 --logger "trx;LogFileName=test-results-net10.0.trx" --logger "console;verbosity=normal"

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Integration Test Results
        path: '**/test-results-*.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: Pack NuGet Package
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: dotnet pack --configuration Release /p:PackageVersion=${{ needs.setup.outputs.semver }}