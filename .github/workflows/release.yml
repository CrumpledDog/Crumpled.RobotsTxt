name: Build and Package

env:
  PATH_TO_EXTENSION: "src/Crumpled.RobotsTxt"
  DOTNET_VERSION: '10'

on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to nuget.org'
        required: false
        type: boolean
        default: false

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
      
      - name: Fetch all tags
        run: git fetch --force --tags
        
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: false
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits

      - name: Echo the version
        run: |
          echo "New release version: '${{ steps.semantic.outputs.new_release_version }}'"
          echo "New release major: '${{ steps.semantic.outputs.new_release_major_version }}'"
          echo "New release minor: '${{ steps.semantic.outputs.new_release_minor_version }}'"
          echo "New release patch: '${{ steps.semantic.outputs.new_release_patch_version }}'"
          echo "Last release version: '${{ steps.semantic.outputs.last_release_version }}'"
          echo "New release published: '${{ steps.semantic.outputs.new_release_published }}'"
  
  build:
    name: Build, Run, CodeGen and Package
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet
      id: nuget-packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-nuget-

    - name: Update Version Files
      run: |

        jq '.version = "${{ needs.setup.outputs.semver }}"' ${{ env.PATH_TO_EXTENSION }}/wwwroot/umbraco-package.json > temp.json && mv temp.json ${{ env.PATH_TO_EXTENSION }}/wwwroot/umbraco-package.json
        echo "Updated version in ${{ env.PATH_TO_EXTENSION }}/wwwroot/umbraco-package.json to ${{ needs.setup.outputs.semver }}"

        # Convert semantic version to numeric file version (e.g., 2.0.0-alpha.1 -> 2.0.0.1)
        SEMVER="${{ needs.setup.outputs.semver }}"
        if [[ $SEMVER == *"-"* ]]; then
          BASE_VERSION=$(echo $SEMVER | cut -d'-' -f1)
          PRERELEASE=$(echo $SEMVER | cut -d'-' -f2)
          # Extract number from prerelease (e.g., alpha.1 -> 1, beta.2 -> 2)
          PRERELEASE_NUM=$(echo $PRERELEASE | grep -o '[0-9]\+$' || echo "0")
          FILE_VERSION="${BASE_VERSION}.${PRERELEASE_NUM}"
        else
          FILE_VERSION="${SEMVER}.0"
        fi
        
        # Update both main and core project files
        update_file_version() {
          local CSPROJ_PATH=$1
          local FILE_VERSION=$2
          local INFORMATIONAL_VERSION=$3
          
          if [ ! -f "$CSPROJ_PATH" ]; then
            echo "Warning: $CSPROJ_PATH not found"
            return
          fi
          
          # Check if FileVersion element exists
          if grep -q "<FileVersion>" "$CSPROJ_PATH"; then
            # Update existing FileVersion
            sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>$FILE_VERSION</FileVersion>|" "$CSPROJ_PATH"
            echo "Updated FileVersion in $CSPROJ_PATH to $FILE_VERSION"
          else
            # Add FileVersion to the first PropertyGroup
            sed -i "0,/<PropertyGroup>/s|<PropertyGroup>|<PropertyGroup>\n\t\t<FileVersion>$FILE_VERSION</FileVersion>|" "$CSPROJ_PATH"
            echo "Added FileVersion to $CSPROJ_PATH with value $FILE_VERSION"
          fi
          
          # Check if InformationalVersion element exists
          if grep -q "<InformationalVersion>" "$CSPROJ_PATH"; then
            # Update existing InformationalVersion
            sed -i "s|<InformationalVersion>.*</InformationalVersion>|<InformationalVersion>$INFORMATIONAL_VERSION</InformationalVersion>|" "$CSPROJ_PATH"
            echo "Updated InformationalVersion in $CSPROJ_PATH to $INFORMATIONAL_VERSION"
          else
            # Add InformationalVersion to the first PropertyGroup
            sed -i "0,/<PropertyGroup>/s|<PropertyGroup>|<PropertyGroup>\n\t\t<InformationalVersion>$INFORMATIONAL_VERSION</InformationalVersion>|" "$CSPROJ_PATH"
            echo "Added InformationalVersion to $CSPROJ_PATH with value $INFORMATIONAL_VERSION"
          fi
        }
        
        # Update both project files
        update_file_version "src/Crumpled.RobotsTxt/Crumpled.RobotsTxt.csproj" "$FILE_VERSION" "$SEMVER"
        update_file_version "src/Crumpled.RobotsTxt.Core/Crumpled.RobotsTxt.Core.csproj" "$FILE_VERSION" "$SEMVER"

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release

    - name: Pack NuGet Package
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: dotnet pack --configuration Release /p:PackageVersion=${{ needs.setup.outputs.semver }}
    
    - name: Login
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/CrumpledDog/index.json"

    - name: Push NuGet Package
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Crumpled.RobotsTxt.*.nupkg"  --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate

    - name: Push MyGet Package
      if: needs.setup.outputs.new_release_published == 'true'
      env:
        MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
      run: |
        if [ -n "$MYGET_API_KEY" ]; then
          dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Crumpled.RobotsTxt.*.nupkg" --api-key $MYGET_API_KEY --source https://www.myget.org/F/umbraco-packages/api/v2/package --skip-duplicate
        else
          echo "MYGET_API_KEY is not set, skipping MyGet push"
        fi

    - name: Push to Nuget.org
      if: ${{ needs.setup.outputs.new_release_published == 'true' && github.event.inputs.publish_to_nuget == 'true' && startsWith(github.ref, 'refs/heads/release/') && !contains(needs.setup.outputs.semver, '-') }}
      run: |
        dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Crumpled.RobotsTxt.*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Crumpled.RobotsTxt.*.snupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Merge release branch to develop
      if: ${{ needs.setup.outputs.new_release_published == 'true' && startsWith(github.ref, 'refs/heads/release/') }}
      run: |
        # Extract version from release branch (e.g., release/v1 -> v1)
        VERSION_SUFFIX=$(echo ${GITHUB_REF#refs/heads/release/})
        DEVELOP_BRANCH="develop/$VERSION_SUFFIX"
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Fetch the develop branch
        git fetch origin $DEVELOP_BRANCH
        
        # Checkout develop branch
        git checkout $DEVELOP_BRANCH
        
        # Merge release branch into develop
        git merge --no-ff origin/${GITHUB_REF#refs/heads/} -m "chore: merge ${GITHUB_REF#refs/heads/} into $DEVELOP_BRANCH after release ${{ needs.setup.outputs.semver }}"
        
        # Push changes
        git push origin $DEVELOP_BRANCH