# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "develop","main","main-bellissima","feature/*" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: prepare git
      run: |
          git config --global user.name "Crumpled Bot"
          git config --global user.email "bot@crumpled-dog.com"
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.x'
        
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0
      with:
        useConfigFile: true
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: pack
      run: dotnet pack src/Crumpled.RobotsTxt/Crumpled.RobotsTxt.csproj --configuration Release
    - name: Login
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/CrumpledDog/index.json"
    - name: push
      run: dotnet nuget push "**/src/Crumpled.RobotsTxt/bin/Release/Crumpled.RobotsTxt.*.nupkg"  --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate

    - name: Tag and Push
      run: |
          git tag "${{ steps.gitversion.outputs.semVer }}"
          git push origin "${{ steps.gitversion.outputs.semVer }}"
